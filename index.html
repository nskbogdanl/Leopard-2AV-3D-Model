<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leopard 2AV</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    /* убираем подпись Sketchfab */
    .sketchfab-embed-wrapper p {
      display: none;
    }
  </style>
</head>

<body>

<div class="sketchfab-embed-wrapper">

  <iframe
    title="Leopard 2AV"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    xr-spatial-tracking
    execution-while-out-of-viewport
    execution-while-not-rendered
    web-share
    src="https://sketchfab.com/models/f394013c06614a2093b047eb06fd3199/embed">
  </iframe>

</div>

</body>
</html>
